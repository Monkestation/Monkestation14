- type: weightedRandom
  id: Announcers
  weights:
    DefaultAnnouncer: 5
    DukeAnnouncer: 5
    InternAnnouncer: 1
    MedbotAnnouncer: 1
    DagothAnnouncer: 5

- type: announcer
  id: DefaultAnnouncer
  sounds:
    Attention:
      path: /Audio/Announcements/attention.ogg
    Announce:
      path: /Audio/_Monkestation/Announcements/AnnouncementConsole/announce.ogg
    GridPowerOff:
      path: /Audio/Announcements/power_off.ogg
      params:
        volume: -4
    GridPowerOn:
      collection: PowerOn
      params:
        volume: -4
    Intercept:
      path: /Audio/Announcements/intercept.ogg
    Welcome:
      path: /Audio/Announcements/welcome.ogg
    Meteors:
      path: /Audio/Announcements/meteors.ogg
      params:
        volume: -4
    War:
      collection: war
    ShuttleCalled:
      path: /Audio/Announcements/shuttlecalled.ogg
    ShuttleRecalled:
      path: /Audio/Announcements/shuttlerecalled.ogg
    ShuttleDock:
      path: /Audio/Announcements/shuttle_dock.ogg
    Notice1:
      path: /Audio/Misc/notice1.ogg
    Notice2:
      path: /Audio/Misc/notice2.ogg
    HereticAshAscend:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_ash.ogg
    HereticBladeAscend:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_blade.ogg
    HereticCosmosAscend:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_cosmos.ogg
    HereticFleshAscend:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_flesh.ogg
    HereticKnockAscend:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_knock.ogg
    HereticRustAscend:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_rust.ogg
    HereticVoidAscend:
      path: /Audio/_Goobstation/Heretic/Ambience/Antag/Heretic/ascend_void.ogg
    BlobDetected:
      path: /Audio/_Goobstation/Announcements/blob_detected.ogg
    BlobCritical:
      path: /Audio/StationEvents/blobin_time.ogg
    HisGraceAscension:
      path: /Audio/_Goobstation/Ambience/Antag/hisgrace_ascension.ogg
