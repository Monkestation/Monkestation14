      path: /Audio/Misc/narsie_rises.ogg
    Aliens:
      path: /Audio/Announcements/aliens.ogg
    AlertLevelBlue:
      path: /Audio/Misc/bluealert.ogg
    AlertLevelViolet:
      path: /Audio/Misc/notice1.ogg
    AlertLevelYellow:
      path: /Audio/Misc/notice1.ogg
    AlertLevelRed:
      path: /Audio/Misc/redalert.ogg
    AlertLevelGamma:
      path: /Audio/Misc/gamma.ogg
      params:
        volume: -2
    AlertLevelDelta:
      path: /Audio/Misc/delta.ogg
      params:
        volume: -3
    AlertLevelEpsilon:
      path: /Audio/Misc/epsilon.ogg
      params:
