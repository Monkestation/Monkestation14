- type: borgType
  id: engineering_kerfo

  dummyPrototype: BorgChassisEngineer

  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleEngineering

  defaultModules:
  - BorgModuleTool
  - BorgModuleConstruction
  - BorgModuleRCD
  - BorgModuleCable

  lawset: Engineer

  radioChannels:
  - Engineering
  - Science

  addComponents:
  - type: Inventory
    templateId: borgNoOffset
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _Omu/Mobs/Species/Cyborgs/kerfo_displacements.rsi
            state: head

  inventoryTemplateId: borgNoOffset
  spriteBodyState: engineer
  spriteHasMindState: engineer_e
  spriteNoMindState: engineer_e_r
  spriteToggleLightState: engineer_l

  petSuccessString: petting-success-engineer-cyborg
  petFailureString: petting-failure-engineer-cyborg

