- type: borgType
  id: medical_kerfo

  dummyPrototype: BorgChassisMedical

  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleChemical
  - BorgModuleTopicals
  - BorgModuleRescue
  - BorgModuleSurgery
  - BorgModuleLollypop

  lawset: Medical

  radioChannels:
  - Science
  - Medical

  addComponents:
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: Sanitized
  - type: SurgeryTarget
  - type: SurgeryIgnoreClothing
  - type: SurgerySpeedModifier
    speedModifier: 1.5
  - type: Inventory
    templateId: borgNoOffset
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _Omu/Mobs/Species/Cyborgs/kerfo_displacements.rsi
            state: head

  inventoryTemplateId: borgNoOffset
  spriteBodyState: medical
  spriteHasMindState: medical_e
  spriteNoMindState: medical_e_r
  spriteToggleLightState: medical_l

  petSuccessString: petting-success-medical-cyborg
